name: Windows-EXE bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tests (Berechnungen, Bestand, Rechte, Druck, Sicherung)
        run: npm test
      - name: EXE bauen
        run: node scripts/build-exe.js --target win-x64
      - name: EXE unter Windows starten und prüfen
        shell: pwsh
        run: |
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-data"
          $p = Start-Process -FilePath "dist\EK-Service.exe" -ArgumentList '--no-browser','--port','18111' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:18111/api/health; $ok = $r.ok } catch {}
          }
          if (-not $ok) { throw 'EK-Service.exe startet nicht' }
          $page = Invoke-WebRequest http://127.0.0.1:18111/ -UseBasicParsing
          if ($page.Content -notmatch 'EK-Service') { throw 'Oberfläche fehlt' }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $h = @{ 'X-EK-Client' = '1' }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18111/api/auth/login -Headers $h -ContentType 'application/json' -Body '{"username":"admin","password":"admin"}' -WebSession $s | Out-Null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18111/api/demo-data -Headers $h -WebSession $s | Out-Null
          $arts = Invoke-RestMethod -Uri http://127.0.0.1:18111/api/articles -WebSession $s
          if ($arts.Count -lt 10) { throw 'Datenbank funktioniert nicht' }
          $w = Invoke-RestMethod -Uri http://127.0.0.1:18111/api/printers-windows -WebSession $s
          Write-Host "Windows-Drucker abfragbar: $($w.available) ($($w.printers.Count) gefunden)"
          if (-not (Test-Path "$env:RUNNER_TEMP\ek-data\ek-service.db")) { throw 'Datenbankdatei fehlt' }
          Stop-Process -Id $p.Id
          Write-Host 'EXE-Prüfung erfolgreich.'
      - name: Verhalten wie ein normales Programm prüfen
        shell: pwsh
        run: |
          # 1) Fensterprogramm: PE-Subsystem muss GUI (2) sein → kein Konsolenfenster
          $b = [System.IO.File]::ReadAllBytes("dist\EK-Service.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { throw "Subsystem ist $sub statt 2 (GUI)" }
          Write-Host "Subsystem: GUI (kein Konsolenfenster)"
          # 3) Zweiter Start + automatisches Beenden, wenn das Fenster geschlossen wird
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-data2"
          $p = Start-Process -FilePath "dist\EK-Service.exe" -ArgumentList '--no-browser','--auto-shutdown','--port','18121' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep 1; try { $ok = (Invoke-RestMethod http://127.0.0.1:18121/api/health).ok } catch {} }
          if (-not $ok) { throw 'Start fehlgeschlagen' }
          # 2) Desktop-Verknüpfung wird beim ersten Start angelegt
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'EK-Service.lnk'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $lnk); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $lnk)) { throw 'Desktop-Verknüpfung fehlt' }
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "Verknüpfung: $lnk -> $t"
          $second = Start-Process -FilePath "dist\EK-Service.exe" -ArgumentList '--no-browser','--port','18121' -PassThru
          if (-not $second.WaitForExit(15000)) { throw 'Zweite Instanz beendet sich nicht' }
          Write-Host "Zweiter Start: keine zweite Kopie (Exit $($second.ExitCode))"
          # Fenster simulieren: Anwesenheits-Verbindung 5 s offen halten, dann schließen
          $c = New-Object System.Net.Sockets.TcpClient('127.0.0.1', 18121)
          $st = $c.GetStream()
          $req = [Text.Encoding]::ASCII.GetBytes("GET /api/presence HTTP/1.1`r`nHost: 127.0.0.1`r`n`r`n")
          $st.Write($req, 0, $req.Length)
          Start-Sleep 5
          $c.Close()
          Write-Host 'Fenster geschlossen – warte auf automatisches Beenden …'
          if (-not $p.WaitForExit(45000)) { Stop-Process -Id $p.Id; throw 'Programm hat sich nach dem Schließen nicht beendet' }
          if (Test-Path "$env:EK_DATA_DIR\laeuft.json") { throw 'Laufzeitdatei wurde nicht aufgeräumt' }
          Get-Content "$env:EK_DATA_DIR\logs\ek-service.log"
          Write-Host 'Programmverhalten OK.'
      - uses: actions/upload-artifact@v4
        with:
          name: EK-Service-Windows
          path: dist/EK-Service.exe
          retention-days: 30
