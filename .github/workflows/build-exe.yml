name: Windows-Programm bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tests (Berechnungen, Bestand, Rechte, Druck, Sicherung)
        run: npm test

      - name: Installer bauen (EK-Service-Setup.exe)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Installer still installieren und Programm prüfen
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-app\EK-Service-Setup-*.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen ($($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\EK-Service\EK-Service.exe"
          if (-not (Test-Path $exe)) { throw 'EK-Service.exe nicht installiert' }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "Installiert: $($vi.ProductName) $($vi.ProductVersion)"
          if ($vi.ProductName -ne 'EK-Service') { throw 'Versionsangabe fehlt' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\EK-Service\EK-Service-Update.bat")) { throw 'Update-Datei fehlt im Programmordner' }
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'EK-Service.lnk'
          if (-not (Test-Path $desk)) { throw 'Desktop-Verknüpfung fehlt' }
          $sm = Join-Path ([Environment]::GetFolderPath('Programs')) 'EK-Service aktualisieren.lnk'
          if (-not (Test-Path $sm)) { throw 'Startmenü-Eintrag „EK-Service aktualisieren“ fehlt' }
          # Programm im Selbsttest starten: Fenster öffnet, Oberfläche lädt, Datenbank läuft
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-daten-inst"
          $res = "$env:RUNNER_TEMP\selbsttest-inst.json"
          $run = Start-Process $exe -ArgumentList '--selbsttest', $res -PassThru
          if (-not $run.WaitForExit(90000)) { Stop-Process -Id $run.Id -Force; throw 'Selbsttest hängt' }
          Get-Content $res
          $j = Get-Content $res -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw 'Selbsttest des installierten Programms fehlgeschlagen' }
          if (-not (Test-Path "$env:EK_DATA_DIR\ek-service.db")) { throw 'Datenbankdatei fehlt' }
          # Altdaten-Übernahme (bisherige Einzel-EXE mit ek-data)
          $alt = "$env:RUNNER_TEMP\alt-ek"
          New-Item -ItemType Directory -Force $alt | Out-Null
          Copy-Item "$env:EK_DATA_DIR\ek-service.db" "$alt\ek-service.db"
          $env:EK_LEGACY_DIR = $alt
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-daten-neu"
          $run = Start-Process $exe -ArgumentList '--selbsttest', "$env:RUNNER_TEMP\selbsttest-alt.json" -PassThru
          if (-not $run.WaitForExit(90000)) { Stop-Process -Id $run.Id -Force; throw 'Selbsttest (Übernahme) hängt' }
          if (-not (Test-Path "$env:EK_DATA_DIR\ek-service.db")) { throw 'Altdaten nicht übernommen' }
          Remove-Item Env:EK_LEGACY_DIR
          # Fensterprogramm (kein Konsolenfenster)
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3C)
          if ([BitConverter]::ToUInt16($b, $pe + 92) -ne 2) { throw 'Kein Fensterprogramm (Subsystem)' }
          Write-Host 'Installer und Programm OK.'

      - name: Programmordner (ZIP, ohne Installer) bauen und prüfen
        shell: pwsh
        run: |
          node scripts/build-portable.js
          if ($LASTEXITCODE -ne 0) { throw 'Bau des Programmordners fehlgeschlagen' }
          $zip = Get-ChildItem dist-app\EK-Service-Programm-*.zip | Select-Object -First 1
          Write-Host "ZIP: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"
          $x = "$env:RUNNER_TEMP\zip-test"
          Expand-Archive $zip.FullName $x -Force
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-daten-zip"
          $res = "$env:RUNNER_TEMP\selbsttest-zip.json"
          $run = Start-Process "$x\EK-Service\EK-Service.exe" -ArgumentList '--selbsttest', $res -PassThru
          if (-not $run.WaitForExit(90000)) { Stop-Process -Id $run.Id -Force; throw 'Selbsttest hängt' }
          Get-Content $res
          if (-not (Get-Content $res -Raw | ConvertFrom-Json).ok) { throw 'Selbsttest des Programmordners fehlgeschlagen' }
          if (-not (Test-Path "$x\EK-Service\EK-Service-Update.bat")) { throw 'Update-Datei fehlt im ZIP' }
          Write-Host 'Programmordner OK.'

      - name: Update-Datei (EK-Service-Update.bat) prüfen
        shell: pwsh
        run: |
          $env:EK_UPDATE_YES = '1'
          $zip = (Get-ChildItem dist-app\EK-Service-Programm-*.zip | Select-Object -First 1).FullName
          $want = (Get-FileHash dist-app\win-unpacked\resources\app.asar).Hash
          $inst = "$env:RUNNER_TEMP\ek-ordner"
          # 1) Bisherige Einzel-EXE (alt) → neuer Programmordner aus ZIP-Datei
          New-Item -ItemType Directory -Force "$inst\ek-data" | Out-Null
          Copy-Item "C:\Windows\System32\notepad.exe" "$inst\EK-Service.exe"
          Set-Content "$inst\ek-data\ek-service.db" 'alte-daten'
          Copy-Item windows\EK-Service-Update.bat $inst\
          $env:EK_UPDATE_SOURCE = $zip
          cmd /c "`"$inst\EK-Service-Update.bat`""
          if ($LASTEXITCODE -ne 0) { throw "Update alt → neu fehlgeschlagen ($LASTEXITCODE)" }
          if ((Get-FileHash "$inst\resources\app.asar").Hash -ne $want) { throw 'Programmordner nicht eingespielt' }
          if ((Get-Content "$inst\ek-data\ek-service.db") -ne 'alte-daten') { throw 'Daten verändert' }
          if (-not (Get-ChildItem "$inst\alte-versionen\EK-Service_*.exe")) { throw 'Alte EXE nicht gesichert' }
          if (-not (Get-ChildItem "$inst\ek-data\backups\*vorupdate.db")) { throw 'Datenbank nicht gesichert' }
          Write-Host "Version nach Update: $((Get-Item "$inst\EK-Service.exe").VersionInfo.ProductVersion)"
          # 2) Fehlerfall: Webseite statt Datei → Abbruch, nichts verändert
          Set-Content "$env:RUNNER_TEMP\kaputt.zip" '<html>Bitte anmelden</html>'
          $env:EK_UPDATE_SOURCE = "$env:RUNNER_TEMP\kaputt.zip"
          cmd /c "`"$inst\EK-Service-Update.bat`""
          if ($LASTEXITCODE -ne 1) { throw "Fehlerfall nicht erkannt ($LASTEXITCODE)" }
          if ((Get-FileHash "$inst\resources\app.asar").Hash -ne $want) { throw 'Programm trotz Fehler verändert' }
          # 3) Ordner → Ordner über Download-Link (lokaler Webserver); veraltete Dateien verschwinden
          Set-Content "$inst\veraltet.txt" 'weg damit'
          $web = Start-Process python -ArgumentList '-m', 'http.server', '18130', '--bind', '127.0.0.1', '--directory', (Split-Path $zip) -PassThru -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) { Start-Sleep 1; try { Invoke-WebRequest http://127.0.0.1:18130/ -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true } catch {} }
          if (-not $up) { throw 'Test-Webserver startet nicht' }
          $env:EK_UPDATE_SOURCE = "http://127.0.0.1:18130/$(Split-Path $zip -Leaf)"
          cmd /c "`"$inst\EK-Service-Update.bat`""
          $rc = $LASTEXITCODE
          Stop-Process -Id $web.Id
          if ($rc -ne 0) { throw "Update über Link fehlgeschlagen ($rc)" }
          if (Test-Path "$inst\veraltet.txt") { throw 'Veraltete Datei nicht entfernt' }
          if (-not (Test-Path "$inst\ek-data\ek-service.db")) { throw 'Datenordner beim Update gelöscht' }
          if (-not (Get-ChildItem "$inst\alte-versionen" -Directory -Filter 'EK-Service_*')) { throw 'Alter Programmordner nicht gesichert' }
          if ((Get-Content "$inst\update-link.txt").Trim() -ne $env:EK_UPDATE_SOURCE) { throw 'Link wurde nicht gespeichert' }
          # 4) Installierte Version über den Installer aktualisieren (Startmenü-Weg)
          $setup = (Get-ChildItem dist-app\EK-Service-Setup-*.exe | Select-Object -First 1).FullName
          $env:EK_UPDATE_SOURCE = $setup
          cmd /c "`"$env:LOCALAPPDATA\Programs\EK-Service\EK-Service-Update.bat`""
          if ($LASTEXITCODE -ne 0) { throw "Update per Installer fehlgeschlagen ($LASTEXITCODE)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\EK-Service\EK-Service.exe")) { throw 'Programm nach Installer-Update fehlt' }
          Write-Host 'Update-Datei OK.'

      - uses: actions/upload-artifact@v4
        with:
          name: EK-Service-Windows
          path: |
            dist-app/EK-Service-Setup-*.exe
            windows/EK-Service-Update.bat
          retention-days: 14

  # Speicher sparen (vom Nutzer gewünscht): nach erfolgreichem Build alle älteren Läufe
  # samt Artefakten löschen. Es bleibt immer nur der neueste Build übrig.
  aufraeumen:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Ältere Builds und Artefakte löschen
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = context.runId;
            let artefakte = 0, laeufe = 0, mb = 0;
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            for (const a of arts) {
              if (a.workflow_run && a.workflow_run.id === keep) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              artefakte++; mb += a.size_in_bytes / 1048576;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });
            for (const r of runs) {
              if (r.id === keep || r.status !== 'completed') continue;
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
              laeufe++;
            }
            core.notice(`Aufgeräumt: ${laeufe} alte Läufe und ${artefakte} Artefakte (${mb.toFixed(0)} MB) gelöscht. Behalten: Lauf ${keep}.`);
