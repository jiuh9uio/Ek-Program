name: Windows-EXE bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tests (Berechnungen, Bestand, Rechte, Druck, Sicherung)
        run: npm test
      - name: EXE bauen
        run: node scripts/build-exe.js --target win-x64
      - name: EXE unter Windows starten und prüfen
        shell: pwsh
        run: |
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-data"
          $p = Start-Process -FilePath "dist\EK-Service.exe" -ArgumentList '--no-browser','--port','18111' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:18111/api/health; $ok = $r.ok } catch {}
          }
          if (-not $ok) { throw 'EK-Service.exe startet nicht' }
          $page = Invoke-WebRequest http://127.0.0.1:18111/ -UseBasicParsing
          if ($page.Content -notmatch 'EK-Service') { throw 'Oberfläche fehlt' }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $h = @{ 'X-EK-Client' = '1' }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18111/api/auth/login -Headers $h -ContentType 'application/json' -Body '{"username":"admin","password":"admin"}' -WebSession $s | Out-Null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18111/api/demo-data -Headers $h -WebSession $s | Out-Null
          $arts = Invoke-RestMethod -Uri http://127.0.0.1:18111/api/articles -WebSession $s
          if ($arts.Count -lt 10) { throw 'Datenbank funktioniert nicht' }
          $w = Invoke-RestMethod -Uri http://127.0.0.1:18111/api/printers-windows -WebSession $s
          Write-Host "Windows-Drucker abfragbar: $($w.available) ($($w.printers.Count) gefunden)"
          if (-not (Test-Path "$env:RUNNER_TEMP\ek-data\ek-service.db")) { throw 'Datenbankdatei fehlt' }
          Stop-Process -Id $p.Id
          Write-Host 'EXE-Prüfung erfolgreich.'
      - name: Verhalten wie ein normales Programm prüfen
        shell: pwsh
        run: |
          # 1) Fensterprogramm: PE-Subsystem muss GUI (2) sein → kein Konsolenfenster
          $b = [System.IO.File]::ReadAllBytes("dist\EK-Service.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { throw "Subsystem ist $sub statt 2 (GUI)" }
          Write-Host "Subsystem: GUI (kein Konsolenfenster)"
          # 3) Zweiter Start + automatisches Beenden, wenn das Fenster geschlossen wird
          $env:EK_DATA_DIR = "$env:RUNNER_TEMP\ek-data2"
          $p = Start-Process -FilePath "dist\EK-Service.exe" -ArgumentList '--no-browser','--auto-shutdown','--port','18121' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep 1; try { $ok = (Invoke-RestMethod http://127.0.0.1:18121/api/health).ok } catch {} }
          if (-not $ok) { throw 'Start fehlgeschlagen' }
          # 2) Desktop-Verknüpfung wird beim ersten Start angelegt
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'EK-Service.lnk'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $lnk); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $lnk)) { throw 'Desktop-Verknüpfung fehlt' }
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "Verknüpfung: $lnk -> $t"
          $second = Start-Process -FilePath "dist\EK-Service.exe" -ArgumentList '--no-browser','--port','18121' -PassThru
          if (-not $second.WaitForExit(15000)) { throw 'Zweite Instanz beendet sich nicht' }
          Write-Host "Zweiter Start: keine zweite Kopie (Exit $($second.ExitCode))"
          # Fenster simulieren: Anwesenheits-Verbindung 5 s offen halten, dann schließen
          $c = New-Object System.Net.Sockets.TcpClient('127.0.0.1', 18121)
          $st = $c.GetStream()
          $req = [Text.Encoding]::ASCII.GetBytes("GET /api/presence HTTP/1.1`r`nHost: 127.0.0.1`r`n`r`n")
          $st.Write($req, 0, $req.Length)
          Start-Sleep 5
          $c.Close()
          Write-Host 'Fenster geschlossen – warte auf automatisches Beenden …'
          if (-not $p.WaitForExit(45000)) { Stop-Process -Id $p.Id; throw 'Programm hat sich nach dem Schließen nicht beendet' }
          if (Test-Path "$env:EK_DATA_DIR\laeuft.json") { throw 'Laufzeitdatei wurde nicht aufgeräumt' }
          Get-Content "$env:EK_DATA_DIR\logs\ek-service.log"
          Write-Host 'Programmverhalten OK.'
      - name: Update-Datei (EK-Service-Update.bat) prüfen
        shell: pwsh
        run: |
          $inst = "$env:RUNNER_TEMP\ek-install"
          New-Item -ItemType Directory -Force "$inst\ek-data" | Out-Null
          Copy-Item "C:\Windows\System32\notepad.exe" "$inst\EK-Service.exe"   # "alte" Version
          Set-Content "$inst\ek-data\ek-service.db" 'alte-daten'
          Copy-Item windows\EK-Service-Update.bat $inst\
          $zip = "$env:RUNNER_TEMP\web\EK-Service-Windows.zip"
          New-Item -ItemType Directory -Force (Split-Path $zip) | Out-Null
          Compress-Archive -Path dist\EK-Service.exe, windows\EK-Service-Update.bat -DestinationPath $zip -Force
          $want = (Get-FileHash dist\EK-Service.exe).Hash
          $env:EK_UPDATE_YES = '1'
          # 1) Update aus ZIP-Datei
          $env:EK_UPDATE_SOURCE = $zip
          cmd /c "`"$inst\EK-Service-Update.bat`""
          if ($LASTEXITCODE -ne 0) { throw "Update aus Datei fehlgeschlagen ($LASTEXITCODE)" }
          if ((Get-FileHash "$inst\EK-Service.exe").Hash -ne $want) { throw 'EXE wurde nicht ersetzt' }
          if (-not (Get-ChildItem "$inst\alte-versionen\EK-Service_*.exe")) { throw 'Alte Version nicht gesichert' }
          if (-not (Get-ChildItem "$inst\ek-data\backups\*vorupdate.db")) { throw 'Datenbank nicht gesichert' }
          Write-Host "Version nach Update: $((Get-Item "$inst\EK-Service.exe").VersionInfo.ProductVersion)"
          # 2) Fehlerfall: Webseite statt Datei → Abbruch, EXE unverändert
          Set-Content "$env:RUNNER_TEMP\kaputt.zip" '<html>Bitte anmelden</html>'
          $env:EK_UPDATE_SOURCE = "$env:RUNNER_TEMP\kaputt.zip"
          cmd /c "`"$inst\EK-Service-Update.bat`""
          if ($LASTEXITCODE -ne 1) { throw "Fehlerfall nicht erkannt ($LASTEXITCODE)" }
          if ((Get-FileHash "$inst\EK-Service.exe").Hash -ne $want) { throw 'EXE trotz Fehler verändert' }
          # 3) Update über Download-Link (lokaler Webserver)
          Copy-Item "C:\Windows\System32\notepad.exe" "$inst\EK-Service.exe" -Force
          $web = Start-Process python -ArgumentList '-m', 'http.server', '18130', '--directory', (Split-Path $zip) -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $env:EK_UPDATE_SOURCE = 'http://127.0.0.1:18130/EK-Service-Windows.zip'
          cmd /c "`"$inst\EK-Service-Update.bat`""
          $rc = $LASTEXITCODE
          Stop-Process -Id $web.Id
          if ($rc -ne 0) { throw "Update über Link fehlgeschlagen ($rc)" }
          if ((Get-FileHash "$inst\EK-Service.exe").Hash -ne $want) { throw 'EXE nach Link-Update falsch' }
          if ((Get-Content "$inst\update-link.txt").Trim() -ne $env:EK_UPDATE_SOURCE) { throw 'Link wurde nicht gespeichert' }
          Write-Host 'Update-Datei OK.'
      - uses: actions/upload-artifact@v4
        with:
          name: EK-Service-Windows
          path: |
            dist/EK-Service.exe
            windows/EK-Service-Update.bat
          retention-days: 14

  # Speicher sparen (vom Nutzer gewünscht): nach erfolgreichem Build alle älteren Läufe
  # samt EXE-Artefakten löschen. Es bleibt immer nur der neueste Build übrig.
  aufraeumen:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Ältere Builds und Artefakte löschen
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = context.runId;
            let artefakte = 0, laeufe = 0, mb = 0;
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            for (const a of arts) {
              if (a.workflow_run && a.workflow_run.id === keep) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              artefakte++; mb += a.size_in_bytes / 1048576;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });
            for (const r of runs) {
              if (r.id === keep || r.status !== 'completed') continue;
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
              laeufe++;
            }
            core.notice(`Aufgeräumt: ${laeufe} alte Läufe und ${artefakte} Artefakte (${mb.toFixed(0)} MB) gelöscht. Behalten: Lauf ${keep}.`);
